name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses (SDK is preinstalled on ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npm test
      - name: Build web app for the native shell
        run: npm run build
        env:
          VITE_BASE: /
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kotodama-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kotodama-android-apk
          path: kotodama-android.apk
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Kotodama APK (última versión)
          body: |
            APK de Android firmado en modo debug. Descárgalo en el móvil, permite «instalar apps de orígenes desconocidos» y ábrelo.
            La PWA (https://gaussiano.github.io/kotodama/) sigue siendo la opción recomendada: misma app, actualizaciones automáticas.
          files: kotodama-android.apk
          prerelease: false
